<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FHIR NGS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --cp-bg: #0d0d0f;
      --cp-surface: #13131a;
      --cp-border: #00ffe7;
      --cp-yellow: #f5e642;
      --cp-pink: #ff2d78;
      --cp-text: #e0e0e0;
    }

    body {
      background-color: var(--cp-bg);
      color: var(--cp-text);
      font-family: 'Courier New', monospace;
    }

    .navbar {
      background-color: var(--cp-surface) !important;
      border-bottom: 2px solid var(--cp-border);
      box-shadow: 0 0 12px var(--cp-border);
    }

    .navbar-brand {
      color: var(--cp-yellow) !important;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--cp-yellow);
    }

    .nav-link {
      color: var(--cp-border) !important;
      letter-spacing: 1px;
    }

    .nav-link:hover {
      color: var(--cp-yellow) !important;
      text-shadow: 0 0 6px var(--cp-yellow);
    }

    .card {
      background-color: var(--cp-surface);
      border: 1px solid var(--cp-border);
      box-shadow: 0 0 10px rgba(0, 255, 231, 0.15);
    }

    .card-header {
      background-color: transparent;
      border-bottom: 1px solid var(--cp-border);
      color: var(--cp-yellow);
      letter-spacing: 1px;
    }

    .btn-primary {
      background-color: transparent;
      border: 2px solid var(--cp-border);
      color: var(--cp-border);
      text-shadow: 0 0 6px var(--cp-border);
      box-shadow: 0 0 8px rgba(0, 255, 231, 0.3);
    }

    .btn-primary:hover {
      background-color: var(--cp-border);
      color: var(--cp-bg);
      box-shadow: 0 0 16px var(--cp-border);
    }

    .btn-danger {
      background-color: transparent;
      border: 2px solid var(--cp-pink);
      color: var(--cp-pink);
      box-shadow: 0 0 8px rgba(255, 45, 120, 0.3);
    }

    .btn-danger:hover {
      background-color: var(--cp-pink);
      color: var(--cp-bg);
    }

    .form-control, .form-select {
      background-color: #1a1a2e;
      border: 1px solid var(--cp-border);
      color: var(--cp-text);
    }

    .form-control:focus, .form-select:focus {
      background-color: #1a1a2e;
      border-color: var(--cp-yellow);
      box-shadow: 0 0 8px rgba(245, 230, 66, 0.4);
      color: var(--cp-text);
    }

    .table {
      color: var(--cp-text);
    }

    .table thead th {
      border-bottom: 2px solid var(--cp-border);
      color: var(--cp-yellow);
    }

    .table tbody tr:hover {
      background-color: rgba(0, 255, 231, 0.05);
    }

    .table td, .table th {
      border-color: rgba(0, 255, 231, 0.15);
    }

    a {
      color: var(--cp-border);
    }

    a:hover {
      color: var(--cp-yellow);
    }

    .badge {
      font-family: 'Courier New', monospace;
    }

    .alert-info {
      background-color: rgba(0, 255, 231, 0.1);
      border-color: var(--cp-border);
      color: var(--cp-border);
    }

    .alert-success {
      background-color: rgba(0, 255, 100, 0.1);
      border-color: #00ff64;
      color: #00ff64;
    }

    .alert-danger {
      background-color: rgba(255, 45, 120, 0.1);
      border-color: var(--cp-pink);
      color: var(--cp-pink);
    }

    h1, h2, h3, h4, h5 {
      color: var(--cp-yellow);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/ui/">⬡ FHIR NGS</a>
      <div class="d-flex gap-3">
        <a class="nav-link" href="/ui/">VCF 轉換</a>
        <a class="nav-link" href="/valueset/">ValueSet 參考</a>
      </div>
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
